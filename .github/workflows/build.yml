name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --filter-not-trait "Category=Network" --filter-not-trait "Category=Assets"
      - name: Publish CLI and desktop app (single-file win-x64)
        run: |
          dotnet publish src/Tm2Ac.Cli -c Release -r win-x64 -o publish
          dotnet publish src/Tm2Ac.App -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: tm2ac-win-x64
          path: |
            publish/tm2ac.exe
            publish/Tm2Ac.exe
          retention-days: 30
      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tm2Ac ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            publish/tm2ac.exe
            publish/Tm2Ac.exe
